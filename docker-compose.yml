version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royal-knot-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SERVE_CLIENT=true
      - DATABASE_URL=postgresql://postgres:royal_knot_secret@postgres:5432/royal_knot_db?schema=public
      - SESSION_SECRET=RoyalKnot#SuperSecureSessionKey2026!
      - DEMO_USER_PASSWORD=RoyalKnot#Production2026
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: royal-knot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: royal_knot_secret
      POSTGRES_DB: royal_knot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
