services:
  - type: web
    name: royal-knot-web
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: node server/scripts/prepare-db.js && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: true
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: royal-knot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        value: RoyalKnot#LocalDev2026

databases:
  - name: royal-knot-db
    plan: free
    postgresMajorVersion: 16
