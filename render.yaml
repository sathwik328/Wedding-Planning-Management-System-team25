services:
  - type: web
    name: royal-knot-web
    env: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: royal-knot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_USER_PASSWORD
        value: RoyalKnot#RenderLive2026

databases:
  - name: royal-knot-db
    plan: free
    postgresMajorVersion: 16
